services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: America/Sao_Paulo
      GENERIC_TIMEZONE: America/Sao_Paulo
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_WEBHOOK_URL: "https://path-blowing-jill-subsidiary.trycloudflare.com/"
      N8N_EDITOR_BASE_URL: "https://path-blowing-jill-subsidiary.trycloudflare.com/"
      N8N_PROXY_HOPS: "1"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
